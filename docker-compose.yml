services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cotador
      POSTGRES_PASSWORD: cotador
      POSTGRES_DB: cotador
    volumes:
      - ./db/migrations/0001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotador"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://cotador:cotador@db:5432/cotador
      # "demo" roda sem modelo de linguagem; para um modelo real, defina as três variáveis no .env
      LLM_API_URL: ${LLM_API_URL:-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
