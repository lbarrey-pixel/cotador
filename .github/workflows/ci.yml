name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cotador
          POSTGRES_PASSWORD: cotador
          POSTGRES_DB: cotador
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cotador" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cotador:cotador@localhost:5432/cotador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/gerar_seed.py --check
      - run: pytest -rs
      - run: python scripts/avaliar_recall.py
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0001_schema.sql -f db/seed.sql
      - run: python scripts/avaliar_recall.py
        env:
          DATABASE_URL: postgresql://cotador:cotador@localhost:5432/cotador

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx vite build
