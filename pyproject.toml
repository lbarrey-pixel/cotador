[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cotador"
version = "0.1.0"
description = "De pedido de cotação por e-mail a arquivo de importação do ERP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "psycopg[binary]==3.2.9",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.6",
  "extract-msg==0.54.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP038"]
